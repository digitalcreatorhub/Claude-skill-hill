<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude Skill Hill</title>
<meta name="description" content="Claude Skill Hill — бесплатный курс: освой Claude ступень за ступенью. Персональный путь, практика, тесты, библиотека промптов и сертификат.">
<meta name="theme-color" content="#2E47F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skill Hill">
<meta property="og:title" content="Claude Skill Hill">
<meta property="og:description" content="Освой Claude ступень за ступенью. Бесплатно.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono&family=Great+Vibes&family=Marck+Script&display=swap">
<style>
/* Layout: приложение с нижней навигацией — Путь / Промпты / Конструктор / Профиль; ступень и онбординг — листы поверх */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --ink:#13151E; --muted:#5B6075; --line:#DDE0EA;
  --accent:#2E47F5; --accent-soft:#E3E7FF; --done:#E9A51C; --done-soft:#FCF0D2;
  --good:#1F8A55; --good-soft:#DDF3E6; --bad:#C4372F; --bad-soft:#FBE2E0; --fire:#F2622E;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1017; --surface:#171A24; --ink:#ECEEF5; --muted:#9AA0B6; --line:#272B3A;
  --accent:#7D8CFF; --accent-soft:#1F2547; --done:#F2B83D; --done-soft:#3A2F14;
  --good:#5BD394; --good-soft:#15301F; --bad:#FF7F75; --bad-soft:#3A1715; --fire:#FF8A5B; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:700 18px var(--display)}.brand span{color:var(--accent)}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
h1{font:700 clamp(26px,7vw,40px)/1.05 var(--display);margin:4px 0 6px;text-wrap:balance}
h1 span{color:var(--accent)}
h2.v{font:700 22px var(--display);margin:0 0 4px}
.lead{color:var(--muted);margin:0;max-width:56ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.hill svg{width:100%;height:auto;display:block}
.hill .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.big{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.rank{font-weight:600;color:var(--accent)}
.levels{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.lv{all:unset;cursor:pointer;flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;background:var(--surface)}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lv small{font-weight:500;opacity:.7}
.next{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.next p{margin:0;min-width:0}.next .t{font:600 17px/1.3 var(--display)}.next small{opacity:.75;font-size:13px}
.btn{font:600 15px var(--body);border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--done);color:#1b1404}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.sec h3{font:600 15px var(--display);margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
.sec h3 em{font:500 13px var(--body);color:var(--muted);font-style:normal;font-variant-numeric:tabular-nums}
.sec .d{color:var(--muted);font-size:14px;margin:0 0 10px}
.stairs{display:flex;flex-direction:column;gap:6px}
.st{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:transform .15s,border-color .15s}
.st:hover{border-color:var(--accent);transform:translateX(3px)}
.st .n{font:700 18px var(--display);color:var(--accent);font-variant-numeric:tabular-nums;text-align:center}
.st .tt{font-weight:600;min-width:0}
.st .tag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.st .bar{display:flex;align-items:flex-end;gap:2px;height:18px}
.st .bar i{width:4px;background:var(--line);border-radius:1px}
.st.done{background:var(--done-soft);border-color:var(--done)}
.st.done .n{color:var(--done)}.st.done .bar i{background:var(--done)}
.soon{border-style:dashed;color:var(--muted)}
.soon h3{font:600 18px var(--display);color:var(--ink);margin:0 0 6px}
/* nav */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabbar .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
nav.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
nav.tabbar button svg{width:24px;height:24px}
nav.tabbar button[aria-current="page"]{color:var(--accent)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;max-width:760px;margin:0 auto;
  padding:18px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}.st{transition:none}}
.sheet .hd{display:flex;justify-content:space-between;align-items:start;gap:12px}
.x{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:2px 8px;color:var(--muted)}
.sheet h3{font:700 22px/1.2 var(--display);margin:4px 0 12px;text-wrap:balance}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 14px;padding:8px 4px 4px;position:sticky;top:-18px;background:var(--surface)}
.tab{all:unset;cursor:pointer;flex:none;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.pane p,.pane li{max-width:65ch}.pane ul{padding-left:20px;margin:0}
.cmp{display:grid;gap:10px}.cmp div{border-radius:12px;padding:12px 14px}
.cmp .b{background:var(--bad-soft)}.cmp .g{background:var(--good-soft)}
.cmp span{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.cmp .b span{color:var(--bad)}.cmp .g span{color:var(--good)}
.prompt{background:var(--accent-soft);border-radius:12px;padding:14px;font:14px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.copy{all:unset;cursor:pointer;font:600 13px var(--body);color:var(--accent);margin-top:8px;display:inline-block}
.q{font-weight:600;margin:0 0 10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],textarea,select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.choice b{font-size:15px}.choice span{font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.form{display:flex;flex-direction:column;gap:14px}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 200px}
.lib{display:flex;flex-direction:column;gap:10px}
.lib .card h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.lib .card h4 small{color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .card{padding:12px;text-align:center}
.stats b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12.5px;background:var(--surface)}
.badge i{display:block;font-style:normal;font:700 20px var(--display);margin-bottom:2px}
.badge.off{opacity:.4}
.badge.on{border-color:var(--done);background:var(--done-soft)}
canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;animation:up .2s ease;max-width:90%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.install{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:18px;padding:12px 14px}
.install img{width:48px;height:48px;border-radius:12px;flex:none}
.install p{margin:0;min-width:0;flex:1;font-size:14px;line-height:1.35}.install b{display:block;font-size:15px}
.install .x{font-size:20px}
.steps-i{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Claude <span>Skill Hill</span></div>
    <div class="chips">
      <div class="chip" title="streak"><svg viewBox="0 0 24 24" fill="var(--fire)"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg><span id="streak">0</span></div>
      <div class="chip" title="XP"><svg viewBox="0 0 24 24" fill="var(--done)"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg><span id="xp">0</span></div>
    </div>
  </div>

  <!-- PATH -->
  <section id="v-path" class="view" style="display:flex;flex-direction:column;gap:22px">
    <header>
      <h1 id="hello"></h1>
      <p class="lead" id="lead"></p>
    </header>
    <div class="card hill">
      <svg viewBox="-12 -12 344 112" aria-hidden="true">
        <path d="M0 88 C60 86 90 70 130 52 S220 12 320 6" fill="none" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/>
        <path id="climb" d="M0 88 C60 86 90 70 130 52 S220 12 320 6" fill="none" stroke="var(--done)" stroke-width="8" stroke-linecap="round"/>
        <circle id="me" r="9" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>
      </svg>
      <div class="row"><span><span class="big" id="cnt">0</span> <span style="color:var(--muted)" id="ofTot"></span></span><span class="rank" id="rank"></span></div>
    </div>
    <div class="levels" id="levels" role="group"></div>
    <div class="install" id="instBanner" hidden><img src="icon-192.png" alt=""><p><b id="instT"></b><span id="instS"></span></p><button class="btn" id="instB"></button><button class="x" id="instX" aria-label="×">×</button></div>
    <div class="next" id="nextBox">
      <p><span class="eyebrow" style="color:inherit;opacity:.7" id="nextLbl"></span><br><span class="t" id="nextT"></span><br><small id="pace"></small></p>
      <button class="btn" id="nextB"></button>
    </div>
    <main id="list" style="display:flex;flex-direction:column;gap:22px"></main>
  </section>

  <!-- LIBRARY -->
  <section id="v-lib" class="view" hidden style="display:flex;flex-direction:column;gap:16px">
    <div><h2 class="v" id="libH"></h2><p class="lead" id="libP"></p></div>
    <div class="search"><input type="text" id="q" autocomplete="off"><select id="qs" style="flex:0 1 180px"></select></div>
    <div class="lib" id="libList"></div>
  </section>

  <!-- BUILDER -->
  <section id="v-build" class="view" hidden style="display:flex;flex-direction:column;gap:16px">
    <div><h2 class="v" id="bH"></h2><p class="lead" id="bP"></p></div>
    <div class="card form">
      <label class="f"><span id="bl1"></span><input type="text" id="b1"></label>
      <label class="f"><span id="bl2"></span><textarea id="b2"></textarea></label>
      <label class="f"><span id="bl3"></span><textarea id="b3"></textarea></label>
      <div class="row2" style="gap:12px">
        <label class="f" style="flex:1 1 150px"><span id="bl4"></span><select id="b4"></select></label>
        <label class="f" style="flex:1 1 150px"><span id="bl5"></span><select id="b5"></select></label>
      </div>
      <label class="f"><span id="bl6"></span><input type="text" id="b6"></label>
    </div>
    <div class="card"><div class="eyebrow" id="bRes" style="margin-bottom:8px"></div><div class="prompt" id="bOut"></div><button class="copy" id="bCopy"></button></div>
  </section>

  <!-- PROFILE -->
  <section id="v-me" class="view" hidden style="display:flex;flex-direction:column;gap:18px">
    <div><h2 class="v" id="meH"></h2><p class="lead" id="meP"></p></div>
    <div class="stats" id="stats"></div>
    <div><div class="eyebrow" id="badH" style="margin-bottom:8px"></div><div class="badges" id="badges"></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="eyebrow" id="certH"></div><div class="levels" id="certLv"></div>
      <canvas id="cert" width="1200" height="840"></canvas>
      <p id="certNote" style="margin:0;color:var(--muted);font-size:14px"></p>
      <div class="row2"><button class="btn" id="certDl"></button><button class="btn ghost" id="certSh"></button></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow" id="upH"></div><div id="upList" style="display:flex;flex-direction:column;gap:10px"></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="row2" style="justify-content:space-between"><b id="langL"></b><div class="seg" id="langSeg"><button data-l="ru">RU</button><button data-l="en">EN</button></div></div>
      <button class="btn" id="instP" hidden></button>
      <div class="row2"><button class="btn ghost" id="redo"></button><button class="btn ghost" id="reset"></button></div>
      <p style="margin:0;color:var(--muted);font-size:13px" id="disc"></p>
    </div>
  </section>
</div>

<nav class="tabbar"><div class="in">
  <button data-v="path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h4v-4h4v-4h4V8h4V4"/></svg><span></span></button>
  <button data-v="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span></span></button>
  <button data-v="build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-10 10H4v-6z"/><path d="M12 6l6 6"/></svg><span></span></button>
  <button data-v="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span></span></button>
</div></nav>

<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<script src="steps.js"></script>
<script src="steps.en.js"></script>
<script src="level2.js"></script>
<script src="level3.js"></script>
<script src="level4.js"></script>
<script src="level5.js"></script>
<script src="updates.js"></script>

/* ---------- state ---------- */
const KEY="skillhill_v2";

try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o)S={...S,...o};
 else{const old=JSON.parse(localStorage.getItem("skillhill_done")||"[]");S.done=old;S.xp=old.length*50}}catch(e){}
if(!S.lang)S.lang=(navigator.language||"ru").toLowerCase().startsWith("ru")?"ru":"en";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const L=()=>S.lang==="en"?window.LEVELS_EN:window.LEVELS_RU;
const t=()=>T[S.lang];
let lv=0,view="path";
const sid=(lvId,i)=>lvId+":"+i;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);
 for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(set.has(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
const rankIdx=()=>RANK_XP.filter(x=>S.xp>=x).length-1;
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function addXP(n){const r=rankIdx();S.xp+=n;if(!S.days.includes(today()))S.days.push(today());save();if(rankIdx()>r)setTimeout(()=>toast(t().lvlUp(t().ranks[rankIdx()])),600);checkBadges();chips()}
function badgeState(){const d=S.done.filter(x=>x.startsWith("base:")).length,s=streak();
 return [d>=1,d>=7,d>=15,d>=30,s>=3,s>=7,S.quiz.length>=10,S.built]}
function checkBadges(){badgeState().forEach((ok,i)=>{if(ok&&!S.badges.includes(i)){S.badges.push(i);save();setTimeout(()=>toast(t().badgeGot(t().badges[i][1])),1200)}})}
function chips(){$("#xp").textContent=S.xp;$("#streak").textContent=streak()}

/* ---------- nav ---------- */
function go(v){view=v;$$(".view").forEach(x=>x.hidden=x.id!=="v-"+v);$$("nav.tabbar button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
 ({path:renderPath,lib:renderLib,build:renderBuild,me:renderMe})[v]();scrollTo(0,0)}
$$("nav.tabbar button").forEach(b=>b.onclick=()=>go(b.dataset.v));

/* ---------- path ---------- */
const path=$("#climb"),LEN=path.getTotalLength();path.style.strokeDasharray=LEN;
function nextIndex(Lv){const p=S.profile;let order=Lv.steps.map((_,i)=>i);
 if(p&&p.lvl==="pro"&&Lv.id==="base")order=order.filter(i=>Lv.steps[i].s>0).concat(order.filter(i=>Lv.steps[i].s===0));
 return order.find(i=>!S.done.includes(sid(Lv.id,i)))}
function finishDate(left){const per={5:.5,15:1,30:2}[(S.profile||{}).mins||15];const d=new Date();d.setDate(d.getDate()+Math.ceil(left/per));
 return d.toLocaleDateString(S.lang==="en"?"en-GB":"ru-RU",{day:"numeric",month:"long"})}
function renderPath(){
 const tt=t(),Ls=L(),Lv=Ls[lv],p=S.profile;
 $("#hello").textContent=tt.hello(p&&p.name);$("#lead").textContent=tt.lead;
 $("#levels").innerHTML=Ls.map((x,i)=>`<button class="lv" aria-pressed="${i===lv}" data-i="${i}">${x.n}. ${esc(x.name)}${x.soon?` <small>${tt.soon}</small>`:""}</button>`).join("");
 $$(".lv").forEach(b=>b.onclick=()=>{lv=+b.dataset.i;renderPath()});
 const tot=Lv.steps.length||30,n=Lv.steps.filter((_,i)=>S.done.includes(sid(Lv.id,i))).length;
 $("#cnt").textContent=n;$("#ofTot").textContent=tt.of(tot);$("#rank").textContent=tt.ranks[rankIdx()];
 const f=n/tot;path.style.strokeDashoffset=LEN*(1-f);const pt=path.getPointAtLength(LEN*f);$("#me").setAttribute("cx",pt.x);$("#me").setAttribute("cy",pt.y);
 const m=$("#list");m.innerHTML="";
 if(Lv.soon){m.innerHTML=`<div class="card soon"><h3>${esc(Lv.name)}</h3><p style="margin:0">${esc(Lv.sub)}. ${tt.soonTxt}</p></div>`;$("#nextBox").hidden=true;return}
 const rec=p&&Lv.id==="base"?GOAL_STEPS[p.goal]||[]:[];
 Lv.sections.forEach((s,si)=>{
  const idx=Lv.steps.map((x,i)=>[x,i]).filter(([x])=>x.s===si),c=idx.filter(([,i])=>S.done.includes(sid(Lv.id,i))).length;
  const sec=document.createElement("section");sec.className="sec";
  sec.innerHTML=`<h3><span>${esc(s.name)}</span><em>${c}/${idx.length}</em></h3><p class="d">${esc(s.d)}</p><div class="stairs"></div>`;
  const box=sec.querySelector(".stairs");
  idx.forEach(([x,i])=>{const d=S.done.includes(sid(Lv.id,i)),b=document.createElement("button");b.className="st"+(d?" done":"");
   const h=Math.ceil((i+1)/Lv.steps.length*5);
   b.innerHTML=`<span class="n">${i+1}</span><span class="tt">${esc(x.t)}${rec.includes(i)&&!d?`<span class="tag">${tt.forYou}</span>`:""}${x.upd&&(Date.now()-new Date(x.upd))<45*864e5?`<span class="tag" style="background:var(--done-soft);color:var(--ink)">${tt.updTag}</span>`:""}</span><span class="bar">${[1,2,3,4,5].map(k=>`<i style="height:${k*3+3}px;opacity:${k<=h?1:.35}"></i>`).join("")}</span>`;
   b.onclick=()=>openStep(i);box.appendChild(b)});
  m.appendChild(sec)});
 const nx=nextIndex(Lv);$("#nextBox").hidden=false;$("#nextLbl").textContent=n===0&&p&&p.lvl==="pro"?tt.rec:tt.next;
 if(nx===undefined){$("#nextT").textContent=tt.topDone;$("#nextB").hidden=true;$("#pace").textContent=""}
 else{$("#nextT").textContent=`${nx+1}. ${Lv.steps[nx].t}`;$("#nextB").hidden=false;$("#nextB").textContent=tt.go;$("#nextB").onclick=()=>openStep(nx);
  $("#pace").textContent=tt.pace(tt.paceN[(p||{}).mins||15],finishDate(tot-n))}
}

/* ---------- step sheet ---------- */
function sheet(html){const s=$("#sheet");s.innerHTML=html;s.hidden=false;$("#veil").hidden=false;s.scrollTop=0;return s}
function close(){$("#sheet").hidden=true;$("#veil").hidden=true}
$("#veil").onclick=()=>{if(S.profile)close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.profile)close()});
function copyBtn(btn,text,el){btn.onclick=()=>{const tt=t();(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>{btn.textContent=tt.copied},()=>{const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);btn.textContent=tt.sel})}}
const TK=["theory","example","practice","mistakes","quiz","more"];
function openStep(i,tab="theory"){
 const tt=t(),Lv=L()[lv],x=Lv.steps[i],k=sid(Lv.id,i),d=S.done.includes(k);
 const s=sheet(`<div class="hd"><span class="eyebrow">${esc(tt.stepOf(i+1,Lv.steps.length,Lv.sections[x.s].name))}</span><button class="x" aria-label="×">×</button></div>
 <h3>${esc(x.t)}</h3><div class="tabs" role="tablist">${TK.map((q,j)=>`<button class="tab" role="tab" data-k="${q}">${tt.tabs[j]}</button>`).join("")}</div>
 <div class="pane" id="pane"></div>
 <div class="actions">${d?`<button class="btn ghost" data-a="undo">${tt.undo}</button>`:`<button class="btn ok" data-a="done">${tt.doneB}</button>`}${i<Lv.steps.length-1?`<button class="btn ghost" data-a="next">${tt.nextS(i+2)}</button>`:""}</div>`);
 const pane=s.querySelector("#pane");
 const show=q=>{$$(".tab").forEach(z=>z.setAttribute("aria-selected",z.dataset.k===q));
  if(q==="theory"||q==="more")pane.innerHTML=`<p>${esc(q==="theory"?x.theory:x.more)}</p>`;
  if(q==="example")pane.innerHTML=`<div class="cmp"><div class="b"><span>${tt.weak}</span><p style="margin:0">${esc(x.bad)}</p></div><div class="g"><span>${tt.strong}</span><p style="margin:0">${esc(x.good)}</p></div></div>`;
  if(q==="practice"){pane.innerHTML=`<ul>${x.tasks.map(z=>`<li>${esc(z)}</li>`).join("")}</ul><div class="prompt" style="margin-top:14px">${esc(x.prompt)}</div><button class="copy">${tt.copy}</button>`;copyBtn(pane.querySelector(".copy"),x.prompt,pane.querySelector(".prompt"))}
  if(q==="mistakes")pane.innerHTML=`<ul>${x.mistakes.map(z=>`<li>${esc(z)}</li>`).join("")}</ul>`;
  if(q==="quiz"){const[qq,o,a]=x.quiz;pane.innerHTML=`<p class="q">${esc(qq)}</p>${o.map((z,j)=>`<button class="opt" data-j="${j}">${esc(z)}</button>`).join("")}<p id="res" style="font-weight:600"></p>`;
   let tried=false;pane.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;pane.querySelectorAll(".opt").forEach(z=>z.classList.remove("right","wrong"));b.classList.add(j===a?"right":"wrong");
    if(j===a){const first=!tried&&!S.quiz.includes(k);pane.querySelector("#res").textContent=first?tt.right:tt.rightAgain;if(first){S.quiz.push(k);addXP(20)}}else{tried=true;pane.querySelector("#res").textContent=tt.wrong}})}};
 s.querySelectorAll(".tab").forEach(z=>z.onclick=()=>show(z.dataset.k));show(tab);
 s.querySelector(".x").onclick=close;
 s.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(a==="done"){S.done.push(k);addXP(50);renderPath();i<Lv.steps.length-1?openStep(i+1):close()}
  else if(a==="undo"){S.done=S.done.filter(z=>z!==k);S.xp=Math.max(0,S.xp-50);save();chips();renderPath();openStep(i)}
  else openStep(i+1)});
}

 tt.b.forEach((v,i)=>{$("#bl"+(i+1)).textContent=v;const el=$("#b"+(i+1));if(tt.bPh[i])el.placeholder=tt.bPh[i]});

 if(v(1))out.push((en?"About me: ":"Обо мне: ")+v(1)+".");

function onboarding(){const o=t().ob,p=S.profile||{goal:"work",lvl:"new",mins:15,name:""};const st={...p};
 const grp=(key,arr)=>`<div class="choices">${arr.map(([v,a,b])=>`<button class="choice" data-g="${key}" data-v="${v}" aria-pressed="${String(st[key])===String(v)}"><b>${a}</b><span>${b}</span></button>`).join("")}</div>`;
 const s=sheet(`<div class="hd"><span class="eyebrow">Claude Skill Hill</span>${S.profile?`<button class="x">×</button>`:""}</div><h3>${o.h}</h3><p class="lead" style="margin:-4px 0 18px">${o.p}</p>
 <div class="form"><label class="f">${o.name}<input type="text" id="obName" maxlength="40" placeholder="${o.namePh}" value="${esc(st.name||"")}"></label>
 <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">${o.goal}${grp("goal",o.goals)}</div>
 <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">${o.lvl}${grp("lvl",o.lvls)}</div>
 <div class="f" style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px">${o.mins}${grp("mins",o.minsL)}</div></div>
 <div class="actions"><button class="btn" id="obGo">${o.start}</button>${S.profile?"":`<button class="btn ghost" id="obSkip">${o.skip}</button>`}</div>`);

 $("#obGo").onclick=fin;if($("#obSkip"))$("#obSkip").onclick=fin;if(s.querySelector(".x"))s.querySelector(".x").onclick=close}

/* ---------- install ---------- */
let deferredInstall=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function instDismissed(){try{return localStorage.getItem("skillhill_inst_x")==="1"}catch(e){return false}}
function renderInstall(){const i=t().inst,show=!isStandalone();
 $("#instT").textContent=i.t;$("#instS").textContent=i.s;$("#instB").textContent=i.b;$("#instP").textContent=i.p;
 $("#instBanner").hidden=!show||instDismissed();$("#instP").hidden=!show}
async function doInstall(){const i=t().inst;
 if(deferredInstall){deferredInstall.prompt();try{const r=await deferredInstall.userChoice;if(r.outcome==="accepted")deferredInstall=null}catch(e){}return}
 const steps=isIOS()?i.ios:i.gen;
 const s=sheet(`<div class="hd"><span class="eyebrow">Claude Skill Hill</span><button class="x">×</button></div><h3>${i.h}</h3>
  <ol class="steps-i">${steps.map(z=>`<li>${esc(z)}</li>`).join("")}</ol>${isIOS()?`<p class="lead" style="margin-top:14px">${i.iosNote}</p>`:""}
  <div class="actions"><button class="btn" id="instOk">${i.ok}</button></div>`);
 s.querySelector(".x").onclick=close;$("#instOk").onclick=close}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;renderInstall()});
window.addEventListener("appinstalled",()=>{deferredInstall=null;toast(t().inst.done);renderInstall()});
$("#instB").onclick=doInstall;$("#instP").onclick=doInstall;
$("#instX").onclick=()=>{try{localStorage.setItem("skillhill_inst_x","1")}catch(e){}renderInstall()};
